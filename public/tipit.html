<!DOCTYPE html>
<html lang="de">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TipIt - BZZR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
        .player-card {
            background-color: #1a202c;
            color: #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        .slot-container {
            min-height: 100px;
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Lautstärke Steuerung -->
    <div class="fixed top-4 left-4 z-50 flex flex-col gap-3 bg-gray-900/80 p-3 rounded-xl border border-gray-700 backdrop-blur-sm">
        <div class="flex items-center gap-3">
            <span class="text-xl">🎮</span>
            <input id="gameVolume" type="range" min="0" max="1" step="0.01" value="0.2" 
                   class="w-24 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-teal-400">
        </div>
        
        <div class="flex items-center gap-3">
            <span class="text-xl">🎵</span>
            <input id="liveVolume" type="range" min="0" max="1" step="0.01" value="0.5" 
                   class="w-24 h-1.5 bg-gray-600 rounded-lg appearance-none cursor-pointer accent-red-500">
        </div>
    </div>
    
    <audio id="buzzerSound" src="/sounds/buzzer.mp3"></audio>
    <audio id="correctSound" src="/sounds/correct.mp3"></audio>
    <audio id="wrongSound" src="/sounds/wrong.mp3"></audio>

    <!-- Namenseingabe zum Beitreten -->
    <div id="nameEntry" class="w-full max-w-sm flex flex-col items-center gap-4 my-auto">
        <h1 class="text-4xl font-extrabold text-teal-400 tracking-wider mb-2">TipIt</h1>
        <p class="text-gray-400 text-sm text-center mb-2">Kaufe Hinweise mit Münzen und finde den gesuchten Begriff!</p>
        <input type="text" id="playerNameInput" placeholder="Dein Name" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-teal-400 text-center">
        <button id="registerPlayerBtn" class="w-full bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-6 rounded-lg transition duration-300">
            Beitreten
        </button>
    </div>

    <!-- Haupt-Spielfeld (wird nach Beitritt sichtbar) -->
    <div id="game-container" class="w-full max-w-[1550px] hidden flex-grow flex flex-col justify-start my-auto py-4">
        
        <!-- Header / Game Title -->
        <div class="text-center mb-4 flex items-center justify-center gap-3">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-teal-400 tracking-wider">TipIt</h1>
            <span id="modBadge" class="hidden bg-amber-500/20 text-amber-300 border border-amber-500/50 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                👑 Moderator
            </span>
            <button id="openConfigBtn" class="hidden bg-gray-800 hover:bg-gray-700 text-teal-300 border border-gray-600 font-bold text-xs py-1.5 px-3 rounded-lg transition duration-200 shadow flex items-center gap-1.5">
                ⚙️ Hinweise verwalten
            </button>
        </div>

        <!-- 3-Spalten Layout: Links (3 Spieler), Mitte (Hinweisliste), Rechts (3 Spieler) -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start mt-5">
            
            <!-- Linke Spalte: Spieler 1, 5, 3 (Top, Mid, Bot) -->
            <div class="lg:col-span-4 flex flex-col gap-5 items-center lg:items-end">
                <!-- Slot 0: Top-Left (Spieler 1) -->
                <div id="slot-0" class="slot-container"></div>
                <!-- Slot 4: Mid-Left (Spieler 5) -->
                <div id="slot-4" class="slot-container"></div>
                <!-- Slot 2: Bot-Left (Spieler 3) -->
                <div id="slot-2" class="slot-container"></div>
            </div>

            <!-- Mittlere Spalte: Hinweisliste und persönliche Hinweise -->
            <div class="lg:col-span-4 flex flex-col gap-3 max-w-sm w-full mx-auto">
                <div id="moderatorTargetTerm" class="hidden text-center text-sm font-bold text-amber-300 break-words"></div>
                <section class="flex flex-col gap-2.5 bg-gray-800/60 p-3 sm:p-4 rounded-2xl border border-gray-700/80 shadow-2xl backdrop-blur-md">
                
                <!-- Bonushinweis (Große Zeile ganz oben) -->
                <div id="bonus-hint-card" class="bg-gradient-to-r from-amber-500/20 via-yellow-500/10 to-amber-500/20 border-2 border-yellow-500/60 rounded-xl p-3 flex flex-col sm:flex-row items-center justify-between gap-2 shadow-lg">
                    <div class="flex items-center gap-2.5">
                        <span class="text-xl sm:text-2xl">⭐</span>
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-yellow-400 block">Bonushinweis für Alle</span>
                            <span id="bonus-hint-text" class="text-xs sm:text-sm font-semibold text-gray-300 italic">Verdeckt</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <!-- Wird dynamisch per JS gesteuert -->
                    </div>
                </div>

                <!-- 10 Hinweise (Kleinere Zeilen) -->
                <div id="hints-list" class="flex flex-col gap-1.5 mt-1">
                    <!-- Wird dynamisch per JS befüllt -->
                </div>

                </section>

                <aside id="personalHintsPanel" class="hidden w-full">
                    <h2 class="mb-2 text-center text-xs font-bold uppercase tracking-wider text-teal-300">Deine gekauften Hinweise</h2>
                    <div id="personalHintsList" class="grid grid-cols-2 gap-2"></div>
                </aside>
            </div>

            <!-- Rechte Spalte: Spieler 2, 6, 4 (Top, Mid, Bot) -->
            <div class="lg:col-span-4 flex flex-col gap-5 items-center lg:items-start">
                <!-- Slot 1: Top-Right (Spieler 2) -->
                <div id="slot-1" class="slot-container"></div>
                <!-- Slot 5: Mid-Right (Spieler 6) -->
                <div id="slot-5" class="slot-container"></div>
                <!-- Slot 3: Bot-Right (Spieler 4) -->
                <div id="slot-3" class="slot-container"></div>
            </div>

        </div>

        <div id="status-bar" class="text-center mt-4">
            <p id="tipitStatus" class="text-lg text-yellow-300 font-semibold"></p>
        </div>
    </div>

    <!-- Modal Overlay für den Moderator (Hinweise bearbeiten) -->
    <div id="modConfigModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-3xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-900/50">
                <h3 class="text-xl font-bold text-teal-300 flex items-center gap-2">
                    ⚙️ TipIt Hinweise & Einstellungen
                </h3>
                <span id="roundPageIndicator" class="ml-auto mr-4 text-xs font-semibold text-gray-400"></span>
                <button id="closeConfigBtn" class="text-gray-400 hover:text-white text-2xl font-bold p-1">
                    &times;
                </button>
            </div>
            
            <!-- Modal Body (Scrollable) -->
            <div class="p-5 overflow-y-auto flex flex-col gap-6 flex-grow">
                <div class="flex flex-col items-center gap-2 text-center">
                    <label for="cfgTargetTerm" class="text-xs font-bold uppercase tracking-wider text-teal-300">Gesuchter Begriff</label>
                    <input type="text" id="cfgTargetTerm" placeholder="Begriff dieser Runde" class="w-full max-w-md border-b-2 border-teal-500/60 bg-transparent px-2 py-2 text-center text-xl font-bold text-white outline-none transition focus:border-teal-300">
                </div>

                <!-- Bonushinweis bearbeiten -->
                <div class="bg-gray-900/50 border border-yellow-500/40 p-4 rounded-xl flex flex-col gap-2">
                    <label class="text-sm font-bold text-yellow-400 flex items-center gap-1.5">
                        ⭐ Bonushinweis (für alle sichtbar beim Aufdecken)
                    </label>
                    <input type="text" id="cfgBonusHint" placeholder="Tipp für alle Spieler..." 
                           class="w-full p-2.5 rounded-lg bg-gray-700 border border-gray-600 text-white text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400">
                </div>

                <!-- 10 Hinweise bearbeiten -->
                <div class="flex flex-col gap-3">
                    <h4 class="text-sm font-bold text-gray-300 uppercase tracking-wider">Liste der 10 Hinweise</h4>
                    <div id="cfgHintsContainer" class="flex flex-col gap-3">
                        <!-- Per JS dynamisch befüllt mit 10 Formularzeilen -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-700 bg-gray-900/50 flex justify-between items-center gap-3">
                <div class="flex items-center gap-2">
                    <button id="resetTipitBtn" title="Hinweise zurücksetzen" class="bg-gray-500 hover:bg-gray-600 text-teal-200 font-semibold text-2xl leading-none py-1 px-3 rounded-lg transition">
                        ♻
                    </button>
                    <button id="resetTipitCoinsBtn" title="Gold auf 15 zurücksetzen" class="bg-gray-500 hover:bg-gray-600 text-teal-200 font-semibold text-2xl leading-none py-1 px-3 rounded-lg transition">
                        💱
                    </button>
                </div>
                <div class="flex items-center gap-3">
                    <button id="cancelConfigBtn" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold text-sm py-2 px-4 rounded-lg transition">
                        Abbrechen
                    </button>
                    <button id="saveConfigBtn" class="bg-teal-500 hover:bg-teal-600 text-white font-bold text-sm py-2 px-5 rounded-lg transition shadow">
                        Speichern & Übernehmen
                    </button>
                    <button id="previousRoundBtn" title="Vorherige Runde" class="text-lg leading-none text-teal-200 transition hover:text-white disabled:cursor-not-allowed disabled:opacity-30" disabled>
                        ◀
                    </button>
                    <button id="nextRoundBtn" title="Nächste Runde" class="text-lg leading-none text-teal-200 transition hover:text-white">
                        ▶
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/tipit.js"></script>
</body>
</html>
